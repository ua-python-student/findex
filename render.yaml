# Render blueprint: connect the GitHub repo, Render builds the Dockerfile on every push.
services:
  - type: web
    name: findex
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: INDEX_PATH
        value: /app/index.bin
      - key: LOG_LEVEL
        value: INFO
