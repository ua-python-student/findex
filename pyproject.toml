[project]
name = "findex"
version = "0.1.0"
description = "findex — a search engine built from scratch"
readme = "README.md"
authors = [
    { name = "Student", email = "student@example.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["B023", "F821", "E501", "E702", "E701", "E741"]
