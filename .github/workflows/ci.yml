name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.13t"]   # GIL and free-threaded builds (Lab 5)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not slow" --cov --cov-report=term
      - name: benchmarks (fail on >50% regression of the mean vs the committed baseline)
        if: matrix.python == '3.13'
        run: uv run pytest tests/test_bench.py --benchmark-enable --benchmark-only --benchmark-compare=0001 --benchmark-compare-fail=mean:50%
